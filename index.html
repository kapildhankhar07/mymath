<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calculation Master</title>
<style>
:root{--okbg:#e3f6e8;--badbg:#fdeceb;--bg:#f5f6f2;--c:#fff;--ink:#1c2626;--mu:#5c6b6b;--ac:#0e6b62;--ac2:#e3f1ee;--bd:#d9dfdb;--bad:#b3261e;--ok:#17803d;--wa:#b45309}
[data-theme=dark]{--okbg:#173325;--badbg:#3a1f1d;--bg:#121816;--c:#1a2220;--ink:#e8efec;--mu:#9bb0aa;--ac:#4fc3b3;--ac2:#1f3532;--bd:#2c3a37;--bad:#ff8a80;--ok:#6fd08c;--wa:#f0b25a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--c);border-right:1px solid var(--bd);padding:12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font:700 19px Georgia,serif;margin:4px 8px 12px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
#sv{display:block;margin:12px 8px;color:var(--mu);font-size:13px}
main{flex:1;padding:20px;max-width:1000px;min-width:0}
h2{font:700 26px Georgia,serif;margin:0 0 14px}h3{margin:0 0 6px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px}.st b{display:block;font:700 24px Georgia,serif}.st span,small,.mu{color:var(--mu);font-size:13px}
.b,.g2{font:inherit;padding:9px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--ac);margin:3px 4px 3px 0}
.b{background:var(--ac);color:var(--c)}.g2{background:none;color:var(--ac)}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--ink);max-width:100%}
label{display:block;margin:8px 0 2px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .tm{margin-left:auto;font:700 20px Georgia,serif}
.q{font:700 34px Georgia,serif;margin:18px 0;word-break:break-word}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:20px;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ac2)}.opt.bad{border-color:var(--bad)}
.fb{border-left:4px solid;padding:6px 12px;margin:10px 0}.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bars{display:flex;gap:4px;align-items:flex-end;height:120px;margin:8px 0 16px}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bars i{width:100%;background:var(--ac);border-radius:3px 3px 0 0;min-height:1px}.bars small{font-size:10px}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}
:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:9}
.b{box-shadow:0 4px 0 rgba(0,0,0,.28);font-weight:700;border-radius:14px}.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}.card,.st{border-radius:16px}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}@keyframes pl{50%{transform:scale(1.08)}}.nd{flex:1;min-width:0;height:72px;border-radius:18px;border:2px solid var(--bd);background:var(--c);color:var(--ink);font:inherit;font-size:20px;line-height:1.1;cursor:pointer;padding:4px 0;margin:0}.nd small{display:block;font-size:11px}.nd.dn{background:var(--ac);color:var(--c);border-color:var(--ac)}.nd.cur{border-color:var(--wa);animation:pl 1.4s infinite;box-shadow:0 4px 0 var(--wa)}.nd:disabled{opacity:.45;cursor:default}.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.bg div{border:1px solid var(--bd);border-radius:14px;padding:8px;text-align:center;font-size:13px}.bg .no{opacity:.35;filter:grayscale(1)}@keyframes su{from{transform:translateY(100%)}}@keyframes qin{from{opacity:0;transform:translateX(30px)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pop{50%{transform:scale(1.12);color:var(--ok)}}
.qs{max-width:560px;margin:0 auto;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);display:flex;flex-direction:column}.qt{display:flex;gap:10px;align-items:center}.qt .g2{min-height:40px;height:40px}.pbar{flex:1;height:14px;background:var(--ac2);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .5s}
.tb{height:6px;background:var(--ac2);border-radius:3px;overflow:hidden;margin:10px 0 6px}.tb i{display:block;height:100%;width:100%;background:var(--ac);transition:width .25s linear}.qm{display:flex;justify-content:space-between;font-weight:700}.qb{flex:1;display:flex;flex-direction:column;justify-content:center}.qs .q{text-align:center}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}.og .opt{text-align:center;font-size:26px;font-weight:700;margin:0;box-shadow:0 3px 0 var(--bd)}.og .opt:active{transform:translateY(2px)}
.disp{font:700 38px Georgia,serif;text-align:center;min-height:64px;border-bottom:3px solid var(--bd);margin:6px 0 10px}.disp.okc{color:var(--ok);border-color:var(--ok)}.disp.badc{color:var(--bad);border-color:var(--bad)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp button{font:inherit;font-size:24px;font-weight:700;min-height:56px;border-radius:14px;border:1px solid var(--bd);background:var(--c);color:var(--ink);box-shadow:0 3px 0 var(--bd);cursor:pointer;margin:0}.kp button:active{transform:translateY(2px)}.kp .b{background:var(--ac);color:var(--c);border-color:var(--ac)}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:8;max-height:65vh;overflow:auto;animation:su .2s;border-top:4px solid}.sheet.ok{background:var(--okbg);border-color:var(--ok)}.sheet.bad{background:var(--badbg);border-color:var(--bad)}
.qin{animation:qin .25s}.shake{animation:shake .35s}.pop{animation:pop .35s}
@media(min-width:761px){.sheet{left:220px}}@media(max-width:760px){body.run nav,body.run #sv{display:none}body.run{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}.b,.g2{min-height:44px}nav button em{font-style:normal}nav button span{display:inline-block;width:24px}#inp{font-size:24px;width:150px}
@media(max-width:760px){html{-webkit-text-size-adjust:100%}body{display:block;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:5;display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav h1{display:none}#sv{position:fixed;top:4px;right:10px;margin:0;font-size:11px;z-index:6}
nav button{flex:0 0 auto;width:auto;min-width:76px;text-align:center;padding:6px 4px;font-size:11px;line-height:1.25;min-height:52px}nav button span{display:block;width:auto;font-size:20px}nav button em{display:block}
main{padding:22px 12px 12px}h2{font-size:22px}.q{font-size:28px;margin:14px 0}
input,select{font-size:16px;width:100%;min-height:46px;margin-bottom:4px}#inp{font-size:26px;width:100%}
.b,.g2{min-height:48px;padding:10px 16px}.card{padding:14px}.card>.b,#ans+.b,#fb .b{width:100%;margin:6px 0}
.opt{font-size:22px;padding:16px;min-height:56px}.g{grid-template-columns:repeat(2,1fr)}.st b{font-size:22px}}
</style></head><body>
<nav id="nav" aria-label="Main"></nav><main id="main"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>String(+(+n).toFixed(3)),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const CATS={add:'Addition',sub:'Subtraction',mul:'Multiplication',div:'Division',sq:'Squares',cu:'Cubes',fr:'Fractions to %',pc:'Percentages',sim:'Simplification',apx:'Approximation',mix:'Mixed'};
const DIF=['Beginner','Easy','Medium','Hard','Expert'];
const V={dash:['Dashboard','▦'],path:['My Path','🎯'],road:['Learning Roadmap','☰'],tri:['Calculation Tricks','✦'],prac:['Practice Arena','✎'],test:['Speed Test','⏱'],mis:['Mistake Notebook','✖'],rev:['Revision Center','↻'],ana:['Performance Analytics','▲'],set:['Settings','⚙']};
const DEF=()=>({settings:{theme:'light',sound:true,tq:30,tm:20,ta:80,diff:1,lim:0,xpg:50},att:[],mist:[],prog:{},tests:[],sess:[],path:{},xp:0,xpLog:{},placed:false,chest:''});
let S=DEF(),db=null,cur='dash',run=null,tm=null,sT=null,rv=null,mf={s:'',c:''};
/* ---------- storage ---------- */
const idb=()=>new Promise(r=>{try{const q=indexedDB.open('calcmaster',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbGet=k=>new Promise(r=>{try{if(!db)return r(JSON.parse(localStorage.getItem('cm_'+k)||'null'));const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
function setSt(m,bad){const e=$('#sv');if(e){e.textContent=m;e.style.color=bad?'var(--bad)':''}}
function save(){setSt('Saving…');try{if(db){const t=db.transaction('kv','readwrite'),o=t.objectStore('kv');for(const k in S)o.put(S[k],k);t.oncomplete=()=>setSt('✓ Saved');t.onerror=t.onabort=()=>setSt('Save failed: export a backup',1)}else{for(const k in S)localStorage.setItem('cm_'+k,JSON.stringify(S[k]));setSt('✓ Saved (local storage)')}}catch(e){setSt('Save failed: export a backup',1)}}
const sv=()=>{clearTimeout(sT);sT=setTimeout(save,300)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}
let ac=null;function beep(ok){if(!S.settings.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?660:200;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
/* ---------- question generator ---------- */
function gen(c,d){if(c=='mix')c=P(['add','sub','mul','div','sq','cu','fr','pc','sim','apx']);
const dg=[2,2,3,4,5][d],lo=10**(dg-1),hi=10**dg-1;let q,a,b,x,e,s,n,p,N;
if(c=='add'){a=R(lo,hi);b=R(lo,hi);x=a+b;q=a+' + '+b;e=`${a} + ${b} = ${x}. Add from the left, place by place.`;s='Round one number to a friendly value, add, then adjust the difference.'}
else if(c=='sub'){a=R(lo,hi);b=R(lo,a);x=a-b;q=a+' − '+b;e=`${a} − ${b} = ${x}. Check: ${x} + ${b} = ${a}.`;s='Subtract a rounded number, then give back the extra.'}
else if(c=='mul'){const sp={5:'×10, then ÷2',9:'×10, then subtract the number',11:'number×10 + number',25:'×100, then ÷4',50:'×100, then ÷2',125:'×1000, then ÷8'};
if(d==0){a=R(2,12);b=R(2,12)}else if(R(0,2)==0){b=P([5,9,11,25,50,125]);a=R(12,[0,40,99,300,999][d])}else{a=R(12,[0,30,99,199,999][d]);b=R(11,[0,19,45,99,99][d])}
x=a*b;q=a+' × '+b;const t=Math.floor(b/10)*10,u=b%10;e=sp[b]?`×${b} trick: ${sp[b]}. ${a} × ${b} = ${x}.`:`${a} × ${b} = ${a}×${t} + ${a}×${u} = ${a*t} + ${a*u} = ${x}.`;s=sp[b]?`×${b}: ${sp[b]}.`:'Split the smaller number into tens and units.'}
else if(c=='div'){b=R(2,[9,12,25,50,99][d]);n=R(2,[12,50,150,500,999][d]);a=b*n;x=n;q=a+' ÷ '+b;e=`${a} ÷ ${b} = ${n}, because ${b} × ${n} = ${a}.`;s='÷5: ×2 then ÷10. ÷25: ×4 then ÷100. ÷4: halve twice.'}
else if(c=='sq'){n=R(11,[25,35,50,70,99][d]);x=n*n;q=n+'²';const k=n%10<=5?n%10:10-n%10;e=n%10==5?`${n}²: ${(n-5)/10} × ${(n-5)/10+1} = ${(n-5)/10*((n-5)/10+1)}, then append 25 → ${x}.`:`${n}² = (${n}−${k})(${n}+${k}) + ${k}² = ${(n-k)*(n+k)} + ${k*k} = ${x}.`;s='Ends in 5: t×(t+1) then 25. Otherwise (n−k)(n+k)+k² using the nearest multiple of 10.'}
else if(c=='cu'){n=R(2,[10,15,20,25,30][d]);x=n**3;q=n+'³';e=`${n}² = ${n*n}, then × ${n} = ${x}.`;s='Cube = square × number. Remember 1³ to 10³.'}
else if(c=='fr'){b=P([2,4,5,8,10,16,20,25,40]);a=R(1,d>2?2*b:b-1);x=Math.round(a*100000/b)/1000;q=a+'/'+b+' as a percentage (%)';e=`${a}/${b} = ${a} × (100/${b})% = ${f(x)}%.`;s='Learn 1/2=50, 1/4=25, 1/5=20, 1/8=12.5, 1/16=6.25, 1/20=5, 1/25=4, 1/40=2.5 (%), then multiply.'}
else if(c=='pc'){const m=[5,10,25,60,99][d];if(d<3){p=5*R(1,d?10:4);N=20*R(1,m)}else{p=R(2,98);N=100*R(1,m)}x=p*N/100;q=p+'% of '+N;e=`${p}% of ${N} = ${p} × ${N} ÷ 100 = ${x}.`;s='Build from 10%, 5%, 1%. Also x% of y = y% of x.'}
else if(c=='sim'){const A=R(10,50),B=R(2,9),C=R(10,50),D=R(2,30),E=R(2,12),F=R(2,12);
if(d==0){x=A+B*C;q=`${A} + ${B} × ${C}`;e=`BODMAS: multiply first. ${B}×${C} = ${B*C}; ${A} + ${B*C} = ${x}.`}
else if(d==1){x=A*B-C;q=`${A} × ${B} − ${C}`;e=`${A}×${B} = ${A*B}; ${A*B} − ${C} = ${x}.`}
else if(d==2){x=(A+D)*B-C;q=`(${A} + ${D}) × ${B} − ${C}`;e=`Brackets: ${A+D}; × ${B} = ${(A+D)*B}; − ${C} = ${x}.`}
else if(d==3){x=A*B+E*F-D;q=`${A} × ${B} + ${E} × ${F} − ${D}`;e=`${A*B} + ${E*F} − ${D} = ${x}.`}
else{const t=R(2,9),u=R(2,9),sum=t*R(5,40),p1=R(1,sum-1);x=sum*u/t;q=`(${p1} + ${sum-p1}) × ${u} ÷ ${t}`;e=`Brackets: ${sum}; × ${u} = ${sum*u}; ÷ ${t} = ${x}.`}
s='BODMAS: Brackets, Orders, Division/Multiplication (left to right), Addition/Subtraction.'}
else{const u=d<2?10:100,rn=v=>Math.round(v/u)*u,L=d<2?11:101,H=d<2?999:9999,A=R(L,H),B=R(L,H),C=R(L,H);x=rn(A)+rn(B)-rn(C);q=`Round each number to the nearest ${u} (halves round up), then calculate: ${A} + ${B} − ${C}`;e=`${rn(A)} + ${rn(B)} − ${rn(C)} = ${x}.`;s='Round every number first, then do one clean calculation.'}
return{q:c=='fr'||c=='apx'?q:q+' = ?',ans:x,expl:e,sc:s,cat:c,d}}
function opts(x){const o=new Set([x]),int=Number.isInteger(x);let g=0;while(o.size<4&&g++<200){const dl=int?P([1,2,3,5,10,20,Math.max(1,Math.round(Math.abs(x)/10)),Math.max(1,Math.round(Math.abs(x)/100))]):P([.5,.25,1,2.5,5,10]);const c=+(x+P([-1,1])*dl).toFixed(3);if(c>=0||x<0)o.add(c)}const a=[...o];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
/* ---------- run engine (practice, test, retry) ---------- */
function stop(){if(run)clearTimeout(run.auto);clearInterval(tm);run=null;document.body.classList.remove('run')}
function startRun(o){stop();document.body.classList.add('run');run={o,...o,i:0,log:[],tel:0,qel:0,paused:false,done:false,hearts:3};tm=setInterval(tick,250);showQ()}
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const setT=s=>{const e=$('#tm');if(e)e.textContent=mmss(s)};
function tick(){const r=run;if(!r||r.paused||r.done)return;r.qel+=250;r.tel+=250;let rem,tg;
if(r.test){tg=r.total;rem=tg-r.tel/1000;if(rem<=0)return finish()}else{tg=r.lim||TGT[r.q?r.q.d:1];rem=tg-r.qel/1000;if(r.lim&&!r.answered&&rem<=0)return submit(null,'time')}
if(r.answered)return;setT(r.test||r.lim?rem:r.qel/1000);const b=$('#tbar');if(b){const x=Math.max(0,rem/tg);b.style.width=x*100+'%';b.style.background=x<.25?'var(--bad)':x<.5?'var(--wa)':'var(--ac)'}}
function showQ(){const r=run;if(r.i>=r.n)return finish();r.q=r.forced||(r.pre?r.pre[r.i]:gen(r.cat,r.d));r.forced=null;r.answered=false;r.qel=0;r.buf='';r.opts=r.mcq?opts(r.q.ans):null;
const kp=['1','2','3','4','5','6','7','8','9','.','0','⌫'];
main.innerHTML=`<div class="qs"><div class="qt"><button class="g2" style="margin:0;min-width:44px;padding:0" onclick="endRun()" aria-label="End session">✕</button><div class="pbar"><i id="pgi" style="width:${Math.max(0,r.i-1)/r.n*100}%"></i></div>${r.lesson?'<span id="hr">'+'❤️'.repeat(r.hearts)+'🖤'.repeat(3-r.hearts)+'</span>':''}<button class="g2" id="pb2" style="margin:0;min-width:44px;padding:0" onclick="pause()" aria-label="Pause">⏸</button></div><div class="tb"><i id="tbar"></i></div><div class="qm"><span>${r.i+1}/${r.n}</span><span id="cmb">${(r.cr||0)>=2?'🔥 '+r.cr:''}</span><span id="tm"></span></div><div class="qb"><div class="q qin" id="qq">${esc(r.q.q)}</div><div id="ans">`+(r.mcq?`<div class="og">${r.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${f(o)}</button>`).join('')}</div>`:`<div class="disp" id="disp">&nbsp;</div><div class="kp">${kp.map(k=>`<button onclick="key('${k}')" aria-label="${k}">${k}</button>`).join('')}<button onclick="key('-')" aria-label="plus minus">±</button><button class="b" style="grid-column:span 2;font-size:20px" onclick="sub()">Check</button></div>`)+`</div>${r.test?`<button class="g2" onclick="submit(null,'skip')">Skip</button>`:''}</div><div id="sheet"></div></div>`;
requestAnimationFrame(()=>{const e=$('#pgi');if(e)e.style.width=r.i/r.n*100+'%'});
if(r.test)setT(r.total-r.tel/1000);else if(r.lim)setT(r.lim)}
function pause(){const r=run;r.paused=!r.paused;$('#pb2').textContent=r.paused?'▶':'⏸';$('#ans').style.visibility=r.paused?'hidden':'visible'}
function pick(i){if(run&&!run.answered&&!run.paused)submit(run.opts[i])}
function key(k){const r=run;if(!r||r.answered||r.paused||!$('#disp'))return;let b=r.buf;if(k=='⌫')b=b.slice(0,-1);else if(k=='-')b=b[0]=='-'?b.slice(1):'-'+b;else if(k=='.'){if(!b.includes('.'))b+=(b==''||b=='-')?'0.':'.'}else if(b.length<10)b+=k;r.buf=b;$('#disp').textContent=b||'\u00a0'}

function submit(v,mode){const r=run;if(!r||r.answered||r.paused)return;r.answered=true;const q=r.q,sec=+(r.qel/1000).toFixed(1),ok=v!==null&&Math.abs(v-q.ans)<.005;

function claim(){const t=dk(Date.now());if(S.chest==t)return;S.chest=t;S.xp+=20;S.xpLog[t]=(S.xpLog[t]||0)+20;confetti();save();toast('+20 XP chest claimed!');go('path')}
function greet(){const h=new Date().getHours();return(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+'! Ready for a quick calculation workout?'}
function weekHtml(){const days=new Set(S.att.map(x=>dk(x.t)));let h='<div class="row" style="justify-content:space-between;margin-top:8px">';for(let i=6;i>=0;i--){const t=Date.now()-i*864e5;h+=`<div style="text-align:center"><small>${'SMTWTFS'[new Date(t).getDay()]}</small><br>${days.has(dk(t))?'🔥':'⚪'}</div>`}return h+'</div>'}
function startTrick(i){const t=TR[i];startRun({kind:'Trick: '+t[0],cat:t[1],d:1,n:5,mcq:false,lim:0})}
function totd(nx,w){const c=w||(nx&&nx[0]),L=TR.filter(t=>t[1]==c),A=L.length?L:TR,t=A[new Date().getDate()%A.length];return `<div class="card"><h3>💡 Trick of the day</h3><b>${esc(t[0])}</b><p>${esc(t[2])}<br><small>${esc(t[3])}</small></p><button class="g2" onclick="startTrick(${TR.indexOf(t)})">Try 5 questions</button></div>`}
function badgeHtml(){const a=S.att.length,P2=Object.values(S.path),sk=streak(),days=new Set(S.att.map(x=>dk(x.t))).size,B=[['🌱','First steps','10 questions',a>=10],['💯','Century','100 questions',a>=100],['🏆','500 club','500 questions',a>=500],['🔥','3-day streak','3 days in a row',sk>=3],['⚡','Week warrior','7-day streak',sk>=7],['⭐','Three stars','3 stars on a lesson',P2.some(x=>x.stars==3)],['🎓','Skill master','All 5 levels of a skill',UN.some(c=>lvl(c)==5)],['🧠','Mistake fixer','Understand 5 mistakes',S.mist.filter(m=>m.status=='understood').length>=5],['🚀','Speedster','20+ questions/min in a test',S.tests.some(t=>t.qpm>=20)],['📅','Regular','10 different days',days>=10]];return `<h3 style="margin-top:14px">Badges (${B.filter(b=>b[3]).length}/${B.length})</h3><div class="bg">${B.map(b=>`<div class="${b[3]?'':'no'}"><span style="font-size:26px">${b[0]}</span><br><b>${b[1]}</b><br><small>${b[2]}</small></div>`).join('')}</div><br>`}
/* ---------- navigation ---------- */
const VW={dash,path,road,tri,prac,test,mis,rev,ana,set};
function go(v){if(run&&!run.done&&!confirm('Leave this session? Answers so far are saved.'))return;stop();cur=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));const ab=document.querySelector('#nav button.on');if(ab&&ab.scrollIntoView)ab.scrollIntoView({inline:'center',block:'nearest'});main.innerHTML=VW[v]();window.scrollTo(0,0)}
(async()=>{try{await idb();for(const k of Object.keys(S)){const v=await dbGet(k);if(v!=null)S[k]=k=='settings'?{...DEF().settings,...v}:v}}catch(e){}
document.documentElement.dataset.theme=S.settings.theme;$('#nav').innerHTML='<h1>Calculation Master</h1>'+Object.keys(V).map(k=>`<button data-v="${k}" onclick="go('${k}')"><span>${V[k][1]}</span><em>${V[k][0]}</em></button>`).join('')+'<small id="sv">'+(db?'✓ Storage ready':'Using local storage')+'</small>';go('path')})();
</script></body></html>
